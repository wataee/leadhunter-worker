name: Weekly Sources Verification

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: node scripts/verify-sources.mjs

      - name: Run evaluation and gigRate re-scoring script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: node scripts/evaluate-sources.mjs

      - name: Run catalog tests
        run: npm test

      - name: Check for changes
        id: git_status
        run: |
          git status --porcelain web/src/shared/sources.catalog.json data/candidates.unverified.json
          if [[ -n $(git status --porcelain web/src/shared/sources.catalog.json data/candidates.unverified.json) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request on update
        if: steps.git_status.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(catalog): automated weekly verification and gigRate update'
          title: 'Automated Catalog Verification & Gig-Rate Update'
          body: |
            Weekly scheduled verification and evaluation of Telegram sources completed.
            Updated `sources.catalog.json` with fresh `gigRate`, `gigsPerWeek`, `lastEvaluatedAt`, and recomputed `qualityScore`.
            Sources with zero gig-rate over the last 30 days are flagged with `zero_gig_rate_30d` for review/disablement.
          branch: automated/sources-update
          delete-branch: true
