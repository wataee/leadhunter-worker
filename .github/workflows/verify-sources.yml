name: Weekly Sources Verification

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification script
        run: node scripts/verify-sources.mjs

      - name: Run catalog tests
        run: npm test

      - name: Check for changes
        id: git_status
        run: |
          git status --porcelain web/src/shared/sources.catalog.json data/candidates.unverified.json
          if [[ -n $(git status --porcelain web/src/shared/sources.catalog.json data/candidates.unverified.json) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request on update
        if: steps.git_status.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(catalog): automated weekly verification update'
          title: 'Automated Catalog Verification Update'
          body: |
            Weekly scheduled verification of Telegram sources completed.
            Updated `sources.catalog.json` and `candidates.unverified.json` with fresh quality scores, subscriber metrics, and activity status.
          branch: automated/sources-update
          delete-branch: true
