name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        os: [ubuntu-latest]

    env:
      CI: "true"
      NODE_ENV: test
      API_ID: "123456"
      API_HASH: "0123456789abcdef0123456789abcdef"
      SESSION_STRING: "dummy_session_string_for_ci_tests"
      WEBHOOK_SECRET: "dummy_webhook_secret_for_ci_at_least_16_chars"
      APP_PASSWORD: "test_admin_password_123"
      APP_SESSION_SECRET: "test_session_secret_at_least_32_chars_long"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Run unit tests
        run: npm test

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck web app
        run: npm run typecheck

      - name: Build web app
        run: npm run build
